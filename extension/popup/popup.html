<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartDoc AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">SMARTDOC AI</p><h1>Ask your documents.</h1></div>
      <span class="connection-dot" title="Backend connection status"></span>
    </header>
    <p class="intro">Chat naturally about your documents with grounded answers and page references.</p>

    <section class="workspace-panel" aria-labelledby="documents-heading">
      <div class="section-heading"><h2 id="documents-heading">Workspace</h2><span id="document-count" class="muted">0 documents</span></div>
      <div id="document-list" class="document-list"><p class="empty-state">Upload one or more PDFs to start.</p></div>
      <div class="document-actions">
        <label class="button secondary-button" for="pdf-file">+ Add PDFs</label>
        <input id="pdf-file" type="file" accept="application/pdf" multiple>
        <button id="study-all-button" class="secondary-button" type="button" disabled>Study all</button>
        <button id="clear-button" class="icon-button" type="button" title="Clear workspace" aria-label="Clear workspace">Clear</button>
      </div>
      <p id="upload-status" class="status" role="status"></p>
    </section>

    <section class="chat-panel" aria-labelledby="chat-heading">
      <div class="section-heading"><h2 id="chat-heading">Conversation</h2><span id="scope-status" class="muted">Select documents</span></div>
      <div id="chat" class="chat" aria-live="polite"><div class="welcome"><strong>Ask me anything about your documents.</strong><span>I’ll remember the conversation and explain things clearly.</span></div></div>
      <div class="quick-prompts" aria-label="Quick prompts">
        <button type="button" data-prompt="Summarize the selected documents">Summarize</button>
        <button type="button" data-prompt="Give me the important topics">Important topics</button>
        <button type="button" data-prompt="/keywords hardware components">Keywords</button>
        <button type="button" data-prompt="/find conclusion">Find conclusion</button>
        <button type="button" data-prompt="Compare the selected documents">Compare</button>
      </div>
      <div class="composer"><textarea id="question" rows="2" placeholder="Ask a question..." aria-label="Question"></textarea><button id="ask-button" class="send-button" type="button" aria-label="Send question">Send</button></div>
    </section>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
